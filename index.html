<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamatomat</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <button onclick="clearData()">New session</button>
    <table id="table"></table>
    <button onclick="settleAndShow(players)">Settle</button>
    <div id="output"></div>

    <script src="data.js"></script>
    <script src="algorithm.js"></script>
    <script src="table.js"></script>
    <script>
        function settleAndShow() {
            const out = document.getElementById("output");
            out.innerHTML = "";
            let bSum = 0, cSum = 0;
            players.forEach(p => {
                bSum += p.buyIn;
                cSum += p.cashOut;
            });
            
            if (bSum != cSum) {
                alert(`Sum of buy ins ${bSum/100} does not match sum of cash outs ${cSum/100}`);
                return;
            }
            
            let transactions = settle(players);
            if (transactions.length == 0) return;

            out.innerHTML = "<b>Transactions</b>";
            
            transactions.forEach((t) => {
                const row = document.createElement("p");
                row.textContent = `${t.from} -> ${t.to}: ${t.amount/100}`;
                out.appendChild(row);
            });
        }
    </script>
</body>
</html>
